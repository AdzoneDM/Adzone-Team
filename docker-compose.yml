# Adzone Team con Docker: app (Gunicorn) + tareas programadas + MariaDB.
#
#   cp docker/env.ejemplo .env.docker    # y completa las claves
#   docker compose up -d --build
#
# La app escucha solo en 127.0.0.1:8000: delante va el proxy con HTTPS (nginx, Plesk, Caddy, Traefik…).
# Guía completa: docs/DESPLIEGUE_DOCKER.md

x-app: &app
  build: .
  image: adzone-team:latest
  restart: unless-stopped
  env_file: .env.docker
  environment:
    DB_ENGINE: mysql
    DB_HOST: db
    DB_PORT: "3306"
    MEDIA_ROOT: /data/media
    RESPALDOS_DIR: /data/respaldos
  volumes:
    - media:/data/media
    - respaldos:/data/respaldos
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    command: web
    ports:
      - "127.0.0.1:${PUERTO:-8000}:8000"

  tareas:
    <<: *app
    command: tareas
    healthcheck:
      disable: true

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db:
  media:
  respaldos:
